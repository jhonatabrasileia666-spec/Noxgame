name: Publicar NOX por partes

on:
  workflow_dispatch:
  push:
    paths:
      - "upload/nox.part*"
      - ".github/workflows/importar-nox.yml"

permissions:
  contents: write

concurrency:
  group: publicar-nox
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Validar e extrair pacote NOX
        id: extrair
        shell: bash
        run: |
          set -euo pipefail
          for n in 01 02 03; do
            if [ ! -s "upload/nox.part${n}" ]; then
              echo "As 3 partes ainda nao foram enviadas; faltando nox.part${n}."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          cat upload/nox.part01 upload/nox.part02 upload/nox.part03 > "$RUNNER_TEMP/NOX.zip"
          unzip -tqq "$RUNNER_TEMP/NOX.zip"
          unzip -oq "$RUNNER_TEMP/NOX.zip" -d .
          test -s index.html
          test -d assets
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Confirmar publicação do jogo
        if: steps.extrair.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f upload/nox.part01 upload/nox.part02 upload/nox.part03
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publicar NOX - jogo completo do pacote editavel"
            git push origin HEAD:main
          fi
